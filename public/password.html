<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <meta name="format-detection" content="telephone=no">
  <title>修改密码 · 店销日集</title>
  <link rel="stylesheet" href="/assets/app.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f766e'/%3E%3Ctext x='16' y='22' font-size='16' text-anchor='middle' fill='white' font-family='sans-serif'%3E集%3C/text%3E%3C/svg%3E">
</head>
<body>
  <main class="auth-shell">
    <form class="auth-card" id="pwd-form" novalidate>
      <div class="brand-mark">
        <div class="brand-logo">集</div>
        <div>
          <h1>修改密码</h1>
          <p>为了账号安全，请设置新的登录密码</p>
        </div>
      </div>

      <div class="form-note" id="pwd-note">
        新密码至少 8 位，建议包含字母与数字。修改成功后其他设备的登录状态会自动失效。
      </div>
      <div class="form-error hidden" id="form-error" role="alert" aria-live="assertive"></div>

      <div class="field">
        <label for="old-password">原密码</label>
        <div class="input-wrap input-wrap--action">
          <span class="input-ico" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
              stroke-linecap="round" stroke-linejoin="round"><rect x="4.6" y="10.4" width="14.8" height="9.6" rx="2.4"/>
              <path d="M8.2 10.4V7.6a3.8 3.8 0 0 1 7.6 0v2.8"/></svg>
          </span>
          <input class="input" id="old-password" type="password" autocomplete="current-password"
                 placeholder="请输入当前密码" required>
          <button class="input-action" type="button" data-toggle-password="old-password"
                  aria-label="显示密码" aria-pressed="false" title="显示密码">显示</button>
        </div>
      </div>
      <div class="field">
        <label for="new-password">新密码</label>
        <div class="input-wrap input-wrap--action">
          <span class="input-ico" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
              stroke-linecap="round" stroke-linejoin="round"><rect x="4.6" y="10.4" width="14.8" height="9.6" rx="2.4"/>
              <path d="M8.2 10.4V7.6a3.8 3.8 0 0 1 7.6 0v2.8"/></svg>
          </span>
          <input class="input" id="new-password" type="password" autocomplete="new-password"
                 placeholder="至少 8 位" required minlength="8">
          <button class="input-action" type="button" data-toggle-password="new-password"
                  aria-label="显示密码" aria-pressed="false" title="显示密码">显示</button>
        </div>
      </div>
      <div class="field">
        <label for="confirm-password">确认新密码</label>
        <div class="input-wrap input-wrap--action">
          <span class="input-ico" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
              stroke-linecap="round" stroke-linejoin="round"><rect x="4.6" y="10.4" width="14.8" height="9.6" rx="2.4"/>
              <path d="M8.2 10.4V7.6a3.8 3.8 0 0 1 7.6 0v2.8"/></svg>
          </span>
          <input class="input" id="confirm-password" type="password" autocomplete="new-password"
                 placeholder="再次输入新密码" required minlength="8">
          <button class="input-action" type="button" data-toggle-password="confirm-password"
                  aria-label="显示密码" aria-pressed="false" title="显示密码">显示</button>
        </div>
      </div>

      <button class="btn btn-block btn-lg" type="submit" id="submit-btn">保 存</button>
      <p class="auth-foot"><a href="#" id="back-link">稍后再说，先返回</a></p>
    </form>
  </main>

  <script src="/assets/common.js"></script>
  <script src="/assets/password.js"></script>
</body>
</html>
